<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <style>
        .content{
            width: 100%;
        }
        .blue{
            background: lightblue;
        }
        .pink{
            background: lightpink;
        }
        .red{
            background: coral;
        }
        .purple{
            background: purple;
        }
        .l-purple{
            background: rgb(189, 35, 189);
        }
        .lavender{
            background: plum;
        }
        .l-lavender{
            background: lavender;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12 col-lg-6 blue p-3 text-center">A1</div>
            <div class="col-md-12 col-lg-6 text-white bg-primary p-3 text-center">A2</div>
        </div>
        <div class="row">
            <div class="col-12 text-white bg-success p-3 text-center">B</div>
        </div>
        <div class="row">
            <div class="col-xs-12 col-sm-6 col-lg-4 pink p-3 text-center">C1</div>
            <div class="col-xs-12 col-sm-6 col-lg-4 red p-3 text-center">C2</div>
            <div class="col-xs-12 col-sm-12 col-lg-4 text-white bg-danger p-3 text-center">C3</div>
        </div>
        <div class="row">
            <div class="col-xs-12 col-sm-6 col-lg-3 l-lavender p-3 text-center">D1</div>
            <div class="col-xs-12 col-sm-6 col-lg-3 lavender p-3 text-center">D2</div>
            <div class="col-xs-12 col-sm-6 col-lg-3 l-purple p-3 text-center">D3</div>
            <div class="col-xs-12 col-sm-6 col-lg-3 text-white purple p-3 text-center">D4</div>
        </div>
    </div>
</body>
</html>
