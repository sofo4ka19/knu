<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        form{
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 1px solid black;
            width: fit-content;
            margin: 0 auto;
        }
        p{
            color: gray;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
        }
        span{
            color: red;
            font-weight: bold;
        }
        .submit{
            width: fit-content;
            padding: 2px 5px;
        }
        fieldset{
            margin: 5px 0;
            padding: 20px;
        }
        legend{
            font-variant: small-caps;
            font-size: 1.1em;
        }
        label{
            display: inline-block;
            width: 125px;
        }
        input, select, textarea{
            width: 300px;
            margin-top: 5px;
            padding: 2px;
        }
        select{
            background: white;
            border: 1px solid gray;
            border-radius: 2px;
        }
        .area{
            display: flex;
            width: fit-content;
            align-items: center;
        }
        textarea{
            height: 75px;
            margin-left: 5px;
        }
        .animals input{
            width: fit-content;
        }
        .animals label{
            width: 90px;
        }
    </style>
</head>
<body>
    <form action="">
        <h1>Форма заявки на роботу в зоопарку</h1>
        <p>Будь ласка, заповніть форму. Обов'язкові поля відмічені <span>*</span></p>
        <fieldset>
            <legend>Контактна інформація</legend>
            <label for="name">Ім'я <span>*</span></label>
            <input id="name" name="name" type="text" required>
            <br>
            <label for="tel">Телефон</label>
            <input id="tel" name="tel" type="tel">
            <br>
            <label for="email">E-mail <span>*</span></label>
            <input id="email" name="email" type="email" required>
        </fieldset>
        <fieldset>
            <legend>Персональна інформація</legend>
            <label for="age">Вік <span>*</span></label>
            <input name="age" id="age" min="18" max="65" type="number" required>
            <br>
            <label for="gender">Стать</label>
            <select name="gender" id="gender">
                <option value="man">Чоловік</option>
                <option value="woman">Жінка</option>
            </select>
            <br>
            <div class="area">
                <label for="quality">Перерахуйте особисті якості</label>
                <textarea name="quality" id="quality"></textarea>
            </div>
        </fieldset>
        <fieldset class="animals">
            <legend>Виберіть улюблених тварин</legend>
            <input id="zebra" name="zebra" type="checkbox">
            <label for="zebra">Зебра</label>
            <input id="slon" name="slon" type="checkbox">
            <label for="slon">Слон</label>
            <input id="tiger" name="tiger" type="checkbox">
            <label for="tiger">Тигр</label>
            <input id="human" name="human" type="checkbox">
            <label for="human">Людина</label>
            <br>
            <input id="skuns" name="skuns" type="checkbox">
            <label for="skuns">Скунс</label>
            <input id="lion" name="lion" type="checkbox">
            <label for="lion">Лев</label>
            <input id="nos" name="nos" type="checkbox">
            <label for="nos">Носоріг</label>
            <input id="turtle" name="turtle" type="checkbox">
            <label for="turtle">Черепаха</label>
        </fieldset>
        <input class="submit" type="submit" value="Відправити">
    </form>
</body>
</html>
