<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будильник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .alarm-card {
            margin-bottom: 15px;
            border-left: 5px solid #0d6efd;
        }
        .alarm-active {
            border-left-color: #198754;
        }
        .alarm-inactive {
            border-left-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Будильник</h1>
        
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Додати новий будильник</h3>
                <form id="alarmForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="alarmDate" class="form-label">Дата:</label>
                            <input type="date" class="form-control" id="alarmDate" required>
                        </div>
                        <div class="col-md-6">
                            <label for="alarmTime" class="form-label">Час:</label>
                            <input type="time" class="form-control" id="alarmTime" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="alarmName" class="form-label">Назва будильника (необов'язково):</label>
                        <input type="text" class="form-control" id="alarmName" placeholder="Наприклад: Підйом, Робота і т.д.">
                    </div>
                    <button type="submit" class="btn btn-primary">Додати будильник</button>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-body">
                <h3 class="card-title">Мої будильники</h3>
                <div id="alarmsList">
                    <p class="text-muted">У вас ще немає активних будильників</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const alarmForm = document.getElementById('alarmForm');
            const alarmsList = document.getElementById('alarmsList');
            let alarms = [];
            
            
            // Додавання нового будильника
            alarmForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const date = document.getElementById('alarmDate').value;
                const time = document.getElementById('alarmTime').value;
                const name = document.getElementById('alarmName').value || 'Будильник';
                
                if (!date || !time) {
                    alert('Будь ласка, введіть дату та час');
                    return;
                }
                
                const alarmDateTime = new Date(`${date}T${time}`);
                const now = new Date();
                
                if (alarmDateTime <= now) {
                    alert('Будь ласка, введіть майбутню дату та час');
                    return;
                }
                
                const alarm = {
                    id: Date.now(),
                    name: name,
                    date: date,
                    time: time,
                    datetime: alarmDateTime.getTime(),
                    active: true
                };
                
                alarms.push(alarm);
                renderAlarms();
                alarmForm.reset();
            });
            
            // Перевірка будильників кожну секунду
            setInterval(checkAlarms, 1000);
            
            // Функція для відображення списку будильників
            function renderAlarms() {
                if (alarms.length === 0) {
                    alarmsList.innerHTML = '<p class="text-muted">У вас ще немає активних будильників</p>';
                    return;
                }
                
                // Сортуємо будильники за датою
                alarms.sort((a, b) => a.datetime - b.datetime);
                
                let html = '';
                alarms.forEach(alarm => {
                    const alarmDate = new Date(alarm.datetime);
                    const now = new Date();
                    const statusClass = alarm.active ? 'alarm-active' : 'alarm-inactive';
                    const statusText = alarm.active ? 'Активний' : 'Неактивний';
                    
                    html += `
                        <div class="card alarm-card ${statusClass}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h5 class="card-title">${alarm.name}</h5>
                                        <p class="card-text">${alarmDate.toLocaleString('uk-UA')}</p>
                                    </div>
                                    <div class="text-end">
                                        <span class="badge ${alarm.active ? 'bg-success' : 'bg-danger'}">${statusText}</span>
                                        <div class="mt-2">
                                            <button onclick="toggleAlarm(${alarm.id})" class="btn btn-sm ${alarm.active ? 'btn-warning' : 'btn-success'}">
                                                ${alarm.active ? 'Вимкнути' : 'Увімкнути'}
                                            </button>
                                            <button onclick="deleteAlarm(${alarm.id})" class="btn btn-sm btn-danger">Видалити</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                alarmsList.innerHTML = html;
            }
            
            // Функція для перевірки активних будильників
            function checkAlarms() {
                const now = new Date().getTime();
                
                alarms.forEach(alarm => {
                    if (alarm.active && alarm.datetime <= now) {
                        // Показуємо сповіщення
                        alert(`Будильник: ${alarm.name}\nЧас: ${new Date(alarm.datetime).toLocaleString('uk-UA')}`);
                        
                        // Деактивуємо будильник
                        alarm.active = false;
                        renderAlarms();
                    }
                });
            }
            
            // Глобальні функції для кнопок
            window.toggleAlarm = function(id) {
                alarms = alarms.map(alarm => {
                    if (alarm.id === id) {
                        return {...alarm, active: !alarm.active};
                    }
                    return alarm;
                });
                renderAlarms();
            };
            
            window.deleteAlarm = function(id) {
                if (confirm('Ви впевнені, що хочете видалити цей будильник?')) {
                    alarms = alarms.filter(alarm => alarm.id !== id);
                    renderAlarms();
                }
            };
        });
    </script>
</body>
</html>
