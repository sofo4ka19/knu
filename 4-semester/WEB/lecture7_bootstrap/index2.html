<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        form{
            width: 30%;
            margin: 25px auto;
            box-shadow: 0px 0px 10px rgb(0, 0, 0, 0.25);
            padding: 25px;
            box-sizing: border-box;
            border-radius: 10px;
        }
        h2{
            text-align: center;
            font-weight: bold;
        }
        button{
            width: 100%;
        }
        p{
            margin-top: 7px;
        }
    </style>
</head>
<body>
    <form>
        <h2>Sign in</h2>
        <div class="mb-3">
            <label class="form-label" for="mail">Email address</label><input placeholder="Enter email" class="form-control" type="text" id="mail">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label><input type="password" placeholder="Enter password" id="password" class="form-control">
        </div>
        <button type="button" class="btn btn-primary">Submit</button>
        <p>Forgot <a href="#">password?</a></p>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
